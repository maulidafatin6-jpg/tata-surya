<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jelajah Tata Surya - Media Pembelajaran SD</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Nunito', sans-serif; background: #050510; min-height: 100vh; color: #fff; }

.app { max-width: 820px; margin: 0 auto; padding: 0 0 2rem; }

.header { text-align: center; padding: 2rem 1rem 0.5rem; }
.header h1 { font-family: 'Fredoka One', cursive; font-size: 36px; color: #FFD700; text-shadow: 0 0 30px rgba(255,215,0,0.5); letter-spacing: 2px; }
.header p { font-size: 15px; color: #aabbc0; margin-top: 6px; }

.solar-canvas { position: relative; width: 100%; height: 260px; overflow: hidden; }
.stars-bg { position: absolute; top:0;left:0;right:0;bottom:0; pointer-events:none; }

.sun {
  position: absolute; left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  width: 62px; height: 62px; border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #fff7a0, #FFD700 40%, #FF8C00 80%);
  box-shadow: 0 0 40px 15px rgba(255,200,0,0.5), 0 0 80px 30px rgba(255,150,0,0.2);
  cursor: pointer; z-index: 10; transition: transform 0.2s;
  animation: pulse 2s ease-in-out infinite;
}
.sun:hover { transform: translate(-50%, -50%) scale(1.12); }
@keyframes pulse {
  0%,100%{box-shadow:0 0 40px 15px rgba(255,200,0,0.5),0 0 80px 30px rgba(255,150,0,0.2)}
  50%{box-shadow:0 0 55px 20px rgba(255,200,0,0.7),0 0 100px 40px rgba(255,150,0,0.35)}
}

.orbit {
  position: absolute; left: 50%; top: 50%;
  border-radius: 50%; border: 1px dashed rgba(255,255,255,0.1);
  transform: translate(-50%, -50%);
  pointer-events: none;
}

.planet-wrap { position: absolute; left: 50%; top: 50%; transform-origin: 0 0; }
.planet {
  border-radius: 50%; cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s;
  position: absolute; transform: translate(-50%, -50%);
}
.planet:hover { transform: translate(-50%, -50%) scale(1.4) !important; }
.planet.selected-planet { box-shadow: 0 0 0 3px #fff, 0 0 12px 6px rgba(255,255,255,0.3) !important; }

.planet-label {
  position: absolute; font-size: 9px; color: rgba(255,255,255,0.65);
  white-space: nowrap; text-align: center;
  transform: translateX(-50%); left: 50%; top: calc(100% + 3px);
  font-family: 'Nunito', sans-serif; pointer-events: none;
}

.tabs {
  display: flex; justify-content: center; gap: 6px;
  padding: 0.75rem 1rem; flex-wrap: wrap;
}
.tab {
  padding: 7px 16px; border-radius: 22px;
  border: 1.5px solid rgba(255,255,255,0.15);
  background: rgba(255,255,255,0.05); color: #ccc;
  font-size: 13px; font-family: 'Nunito', sans-serif;
  cursor: pointer; transition: all 0.2s; font-weight: 600;
}
.tab.active { background: rgba(255,215,0,0.2); border-color: #FFD700; color: #FFD700; }
.tab:hover:not(.active) { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.3); }

.content-area { padding: 0.5rem 1.25rem 1rem; }

.planet-card { display: none; animation: fadeIn 0.35s ease; }
.planet-card.active { display: block; }
@keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

.card-header { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }
.card-icon { width: 52px; height: 52px; border-radius: 50%; flex-shrink: 0; }
.card-title { font-family: 'Fredoka One', cursive; font-size: 28px; }
.card-subtitle { font-size: 13px; color: #aabbc0; margin-top: 2px; }

.facts-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 14px; }
@media(min-width:500px){ .facts-grid { grid-template-columns: repeat(4,1fr); } }

.fact-box {
  background: rgba(255,255,255,0.06); border-radius: 12px;
  padding: 10px 12px; border: 1px solid rgba(255,255,255,0.08);
}
.fact-label { font-size: 11px; color: #99aaaa; margin-bottom: 3px; }
.fact-value { font-size: 14px; font-weight: 700; }

.desc {
  font-size: 14px; color: #ccd8e0; line-height: 1.75;
  background: rgba(255,255,255,0.04); border-radius: 12px;
  padding: 12px 16px; border-left: 3px solid;
  margin-bottom: 12px;
}

.fun-fact {
  font-size: 13px; background: rgba(255,215,0,0.07);
  border: 1px solid rgba(255,215,0,0.2); border-radius: 12px;
  padding: 10px 14px; color: #ffe8aa; margin-bottom: 14px; line-height: 1.6;
}
.fun-fact strong { color: #FFD700; }

.quiz-btn {
  display: block; margin: 0 auto;
  padding: 10px 28px; border-radius: 24px;
  border: 2px solid #FFD700; background: rgba(255,215,0,0.12);
  color: #FFD700; font-family: 'Nunito', sans-serif;
  font-weight: 700; font-size: 14px; cursor: pointer;
  transition: all 0.2s;
}
.quiz-btn:hover { background: rgba(255,215,0,0.28); transform: scale(1.03); }

.quiz-area { display: none; margin-top: 14px; }
.quiz-area.show { display: block; animation: fadeIn 0.3s; }

.quiz-box {
  background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
  border-radius: 14px; padding: 16px;
}
.quiz-q { font-size: 15px; font-weight: 700; color: #ffe; margin-bottom: 12px; }
.quiz-opts { display: flex; flex-direction: column; gap: 8px; }
.quiz-opt {
  padding: 10px 14px; border-radius: 10px;
  border: 1.5px solid rgba(255,255,255,0.15);
  background: rgba(255,255,255,0.05); color: #ccc;
  font-size: 14px; font-family: 'Nunito', sans-serif;
  cursor: pointer; text-align: left; transition: all 0.2s;
  font-weight: 600;
}
.quiz-opt:hover:not(:disabled) { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.3); }
.quiz-opt.correct { background: rgba(0,200,100,0.15); border-color: #00cc88; color: #00ffaa; }
.quiz-opt.wrong { background: rgba(255,60,60,0.15); border-color: #ff4444; color: #ff8888; }

.quiz-result { text-align: center; margin-top: 12px; font-weight: 700; font-size: 15px; padding: 8px; border-radius: 8px; }

.divider { height: 1px; background: rgba(255,255,255,0.07); margin: 1.25rem 0; }

footer { text-align: center; padding: 1.5rem; color: #556; font-size: 12px; }
</style>
</head>
<body>
<div class="app">
  <div style="position:relative;">
    <div class="stars-bg" id="stars"></div>
    <div class="header">
      <h1>🌟 Jelajah Tata Surya</h1>
      <p>Media Pembelajaran IPA SD &mdash; Klik planet untuk belajar!</p>
    </div>
    <div class="solar-canvas" id="solarCanvas">
      <div class="sun" id="sun-orb" onclick="selectBody('sun')" title="Matahari"></div>
    </div>
  </div>

  <div class="tabs" id="tabs"></div>
  <div class="divider"></div>
  <div class="content-area" id="contentArea"></div>

  <footer>🪐 Media Pembelajaran Tata Surya &mdash; Untuk Siswa SD</footer>
</div>

    }
  },
  {
    id:'neptunus', name:'Neptunus', r:238, size:16, speed:0.42,
    color:'#5c6bc0', subtitle:'Planet terjauh dari Matahari',
    facts:[
      {l:'Urutan ke-',v:'8'},

    ],

    fun:'Satu tahun di Neptunus sama dengan <strong>165 tahun</strong> di Bumi. Belum ada manusia yang hidup cukup lama untuk menyaksikan Neptunus menyelesaikan satu orbit penuh!',
    quiz:{

      opts:['1 tahun','29 tahun','84 tahun','165 tahun'], ans:3

];

let selected = 'sun';
let angles = {};
let quizAnswered = {};

function makeStar(c) {
  const s = document.createElement('div');
  const size = Math.random()*2.5+0.5;
  const opacity = Math.random()*0.6+0.15;
  s.style.cssText = `position:absolute;width:${size}px;height:${size}px;border-radius:50%;background:rgba(255,255,255,${opacity});left:${Math.random()*100}%;top:${Math.random()*100}%;animation:twinkle ${2+Math.random()*3}s ease-in-out infinite ${Math.random()*3}s;`;
  c.appendChild(s);
}

const style = document.createElement('style');
style.textContent = '@keyframes twinkle{0%,100%{opacity:1}50%{opacity:0.3}}';
document.head.appendChild(style);

const starsEl = document.getElementById('stars');
for(let i=0;i<80;i++) makeStar(starsEl);

function buildSolar() {
  const canvas = document.getElementById('solarCanvas');
  bodies.slice(1).forEach(p => {
    angles[p.id] = Math.random()*Math.PI*2;

    const orbit = document.createElement('div');
    orbit.className = 'orbit';
    orbit.style.cssText = `width:${p.r*2}px;height:${p.r*2}px;margin-left:${-p.r}px;margin-top:${-p.r}px;`;
    canvas.appendChild(orbit);

    const wrap = document.createElement('div');
    wrap.className = 'planet-wrap';
    wrap.id = 'wrap-'+p.id;

    const planet = document.createElement('div');
    planet.className = 'planet';
    planet.id = 'pl-'+p.id;
    planet.style.cssText = `width:${p.size}px;height:${p.size}px;background:${p.color};box-shadow:0 0 8px 3px ${p.color}55;`;
    planet.onclick = () => selectBody(p.id);
    planet.title = p.name;

    if(p.hasRing) {
      const ring = document.createElement('div');
      ring.style.cssText = `position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:${p.size*2.2}px;height:${p.size*0.5}px;border-radius:50%;border:2px solid rgba(240,208,128,0.55);pointer-events:none;`;
      planet.appendChild(ring);
    }

    const label = document.createElement('div');
    label.className = 'planet-label';
    label.textContent = p.name;
    planet.appendChild(label);

    wrap.appendChild(planet);
    canvas.appendChild(wrap);
  });
}

function animatePlanets() {
  const canvas = document.getElementById('solarCanvas');
  const cx = canvas.offsetWidth/2, cy = 130;
  bodies.slice(1).forEach(p => {
    angles[p.id] = (angles[p.id]||0) + p.speed*0.004;
    const x = Math.cos(angles[p.id])*p.r;
    const y = Math.sin(angles[p.id])*p.r*0.32;
    const wrap = document.getElementById('wrap-'+p.id);
    if(wrap) wrap.style.transform = `translate(${x}px,${y}px)`;
  });
  requestAnimationFrame(animatePlanets);
}

function buildTabs() {
  const tabs = document.getElementById('tabs');
  bodies.forEach(b => {
    const t = document.createElement('button');
    t.className = 'tab'+(b.id===selected?' active':'');
    t.id = 'tab-'+b.id;
    t.textContent = b.id==='sun' ? '☀️ Matahari' : b.name;
    t.onclick = () => selectBody(b.id);
    tabs.appendChild(t);
  });
}

function buildContent() {
  const area = document.getElementById('contentArea');
  area.innerHTML = '';
  bodies.forEach(b => {
    const card = document.createElement('div');
    card.className = 'planet-card'+(b.id===selected?' active':'');
    card.id = 'card-'+b.id;

    const iconStyle = b.isSun
      ? `background:radial-gradient(circle at 35% 35%,#fff7a0,#FFD700 40%,#FF8C00 80%);box-shadow:0 0 16px 5px rgba(255,200,0,0.45);`
      : `background:${b.color};box-shadow:0 0 10px 3px ${b.color}77;`;

    const factsHTML = b.facts.map(f=>`
      <div class="fact-box">
        <div class="fact-label">${f.l}</div>
        <div class="fact-value" style="color:${b.isSun?'#FFD700':b.color}">${f.v}</div>
      </div>`).join('');

    card.innerHTML = `
      <div class="card-header">
        <div class="card-icon" style="${iconStyle}"></div>
        <div>
          <div class="card-title" style="color:${b.isSun?'#FFD700':b.color}">${b.name}</div>
          <div class="card-subtitle">${b.subtitle}</div>
        </div>
      </div>
      <div class="facts-grid">${factsHTML}</div>
      <div class="desc" style="border-color:${b.isSun?'#FFD700':b.color}">${b.desc}</div>
      <div class="fun-fact">⚡ <strong>Fakta Seru:</strong> ${b.fun}</div>
      <button class="quiz-btn" onclick="toggleQuiz('${b.id}')">🎯 Uji Pengetahuanmu!</button>
      <div class="quiz-area" id="quiz-${b.id}">
        <div class="quiz-box">
          <div class="quiz-q">${b.quiz.q}</div>
          <div class="quiz-opts" id="opts-${b.id}">
            ${b.quiz.opts.map((o,i)=>`<button class="quiz-opt" onclick="answerQuiz('${b.id}',${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}
          </div>
          <div class="quiz-result" id="res-${b.id}"></div>
        </div>
      </div>`;
    area.appendChild(card);
  });
}

function selectBody(id) {
  selected = id;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.id==='tab-'+id));
  document.querySelectorAll('.planet-card').forEach(c => c.classList.toggle('active', c.id==='card-'+id));
  document.querySelectorAll('.planet').forEach(p => p.classList.remove('selected-planet'));
  if(id!=='sun') {
    const pl = document.getElementById('pl-'+id);
    if(pl) pl.classList.add('selected-planet');
  }
  document.getElementById('contentArea').scrollIntoView({behavior:'smooth', block:'nearest'});
}

function toggleQuiz(id) {
  const qa = document.getElementById('quiz-'+id);
  const isOpen = qa.classList.contains('show');
  qa.classList.toggle('show');
  if(!isOpen && quizAnswered[id]) {
    quizAnswered[id] = false;
    document.getElementById('res-'+id).textContent = '';
    document.querySelectorAll(`#opts-${id} .quiz-opt`).forEach(o => {
      o.classList.remove('correct','wrong'); o.disabled = false
